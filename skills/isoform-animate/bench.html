<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Isoform figure</title>
<link rel="icon" href="data:,">
<style>
  /* ink: the default, neutral like a technical drawing. isocons: the set's own blue, by ?palette=isocons */
  :root {
    color-scheme: light;
    --ground: #ffffff; --ink: #18181b; --muted: #71717a; --rule: #e4e4e7;
    --iso-plate: #ffffff; --iso-face: #ffffff; --iso-edge: #8e8e97; --iso-lo: #d7d7dc; --iso-hi: #18181b; --iso-stroke: 0.9;
  }
  :root[data-palette="isocons"] { --iso-face: #f5fbff; --iso-edge: #229eff; --iso-lo: #b4dcff; --iso-hi: #0050d8; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #0a0a0c; --ink: #ececef; --muted: #8b8b94; --rule: #232327;
      --iso-plate: #0a0a0c; --iso-face: #0a0a0c; --iso-edge: #7a7a84; --iso-lo: #2a2a30; --iso-hi: #f4f4f5;
    }
    :root[data-palette="isocons"]:not([data-theme="light"]) { --iso-face: #191924; --iso-edge: #6a6a80; --iso-lo: #2e2e3c; --iso-hi: #4da3ff; }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #0a0a0c; --ink: #ececef; --muted: #8b8b94; --rule: #232327;
    --iso-plate: #0a0a0c; --iso-face: #0a0a0c; --iso-edge: #7a7a84; --iso-lo: #2a2a30; --iso-hi: #f4f4f5;
  }
  :root[data-theme="dark"][data-palette="isocons"] { --iso-face: #191924; --iso-edge: #6a6a80; --iso-lo: #2e2e3c; --iso-hi: #4da3ff; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: var(--ground); color: var(--ink);
    font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 640px; }
  .plate { position: relative; aspect-ratio: 5 / 4; border: 1px solid var(--rule); border-radius: 24px; overflow: hidden; background: var(--iso-plate); touch-action: none; }
  .plate svg, .plate canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .plate canvas { pointer-events: none; }
  /* faces: filled, dim edges. .sil: a copy on top, masked to the outline, that strokes the silhouette at the same width */
  .icon path, .icon circle, .icon ellipse, .icon rect, .icon polygon, .icon line {
    fill: var(--iso-face); stroke: var(--iso-lo); stroke-width: var(--iso-stroke); stroke-linejoin: round; stroke-linecap: round;
    vector-effect: non-scaling-stroke; transition: stroke 0.26s ease;
  }
  .icon .sil > * { fill: none; stroke: var(--iso-edge); }
  .icon .hi > .sil > * { stroke: var(--iso-hi); }
  .icon .dim > .sil > * { stroke: var(--iso-lo); }
  .icon .ghost { visibility: hidden; }
  /* traces: the phenomenon in the figure's own line, above the faces */
  #stage path.trace { fill: none; stroke: var(--iso-edge); stroke-width: var(--iso-stroke); stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
  #stage path.trace.hi { stroke: var(--iso-hi); }
  #stage path.trace.lo { stroke: var(--iso-lo); }
  #stage path.trace.dash { stroke-dasharray: 2 3; }
  .tag, .label, output, button { font: 11px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.02em; }
  .tag { position: absolute; top: 14px; z-index: 1; color: var(--muted); pointer-events: none; }
  #name { left: 18px; }
  #read { right: 18px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-top: 14px; }
  .label { color: var(--muted); }
  input[type="range"] { flex: 1 1 96px; min-width: 0; height: 32px; margin: 0; background: transparent; cursor: pointer; -webkit-appearance: none; appearance: none; }
  input[type="range"]::-webkit-slider-runnable-track { height: 1px; background: var(--muted); }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; margin-top: -6px; border-radius: 50%; border: 1px solid var(--ink); background: var(--ground); }
  input[type="range"]::-moz-range-track { height: 1px; background: var(--muted); }
  input[type="range"]::-moz-range-thumb { width: 11px; height: 11px; border-radius: 50%; border: 1px solid var(--ink); background: var(--ground); }
  input[type="range"]:focus-visible, button:focus-visible { outline: 1.5px solid var(--ink); outline-offset: 2px; }
  output { min-width: 4ch; text-align: right; font-variant-numeric: tabular-nums; }
  button { height: 32px; padding: 0 12px; border: 1px solid var(--rule); border-radius: 10px; background: transparent; color: var(--ink); cursor: pointer; }
  button[aria-pressed="false"] { color: var(--muted); }
  #means { margin: 14px 0 0; text-wrap: pretty; }
  #effect { margin: 4px 0 0; color: var(--muted); }
  #rules, #credit { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
  #credit a { color: inherit; }
  #error { margin: 12px 0 0; padding-left: 10px; border-left: 2px solid #e5484d; color: #e5484d; font: 12px/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap; }
  #error:empty { display: none; }
</style>
</head>
<body>
<main>
  <div class="plate" id="stage">
    <span class="tag" id="name"></span>
    <output class="tag" id="read" aria-live="polite">rest</output>
    <canvas class="under" aria-hidden="true"></canvas>
    <svg viewBox="0 0 400 320" role="img" aria-labelledby="means"></svg>
    <canvas class="over" aria-hidden="true"></canvas>
  </div>
  <div class="controls">
    <label class="label" for="intensity">Intensity</label>
    <input id="intensity" type="range" min="0" max="1" step="0.01" value="0.5">
    <output id="value" for="intensity">0.50</output>
    <button id="fx" type="button" aria-pressed="false">Effect</button>
    <button id="theme" type="button">Theme</button>
  </div>
  <p id="means"></p>
  <p id="effect"></p>
  <p id="rules"></p>
  <p id="credit"></p>
  <pre id="error"></pre>
</main>
<script>
/*ICON*/
</script>
<script>
/*KERNEL*/
</script>
<script>
(() => {
  "use strict";
  const q = new URLSearchParams(location.search);
  const $ = (id) => document.getElementById(id);
  const stage = $("stage"), svg = stage.querySelector("svg"), read = $("read"), slider = $("intensity");
  const fail = (msg) => { $("error").textContent += `${msg}\n`; };
  addEventListener("error", (e) => fail(e.message));
  addEventListener("unhandledrejection", (e) => fail(String(e.reason)));

  if (q.get("w")) document.querySelector("main").style.maxWidth = `${parseInt(q.get("w"), 10)}px`;
  const theme = q.get("theme");
  if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
  if (q.get("palette") === "isocons") document.documentElement.dataset.palette = "isocons";
  /* the effect layer is opt-in: off unless ?gl=1 or the reader presses Effect */
  stage.dataset.gl = q.get("gl") === "1" ? "on" : "off";
  $("fx").setAttribute("aria-pressed", String(stage.dataset.gl === "on"));
  const i0 = q.has("intensity") ? Math.min(1, Math.max(0, parseFloat(q.get("intensity")) || 0)) : 0.5;
  slider.value = i0;

  let decl = null, handle = null;
  const value = (t) => {
    const [a, b, c] = decl.range;
    return t <= 0.5 ? a + (b - a) * (t / 0.5) : b + (c - b) * ((t - 0.5) / 0.5);
  };
  const show = () => { $("value").textContent = Number(slider.value).toFixed(2); };

  function mount() {
    handle?.destroy();
    while (svg.firstChild) svg.firstChild.remove();
    for (const c of stage.querySelectorAll("canvas")) { const n = c.cloneNode(); c.replaceWith(n); }
    read.textContent = "rest";
    try {
      handle = decl.mount({ stage, svg, read, src: ISOFORM_ICON.svg }, value(Number(slider.value)));
    } catch (err) { fail(err.stack || err.message); return; }
    const at = q.get("at");
    if (at) {
      const [x, y] = at.split(",").map(Number);
      setTimeout(() => stage.dispatchEvent(new CustomEvent("isoform:at", { detail: [x, y] })), 60);
    }
  }

  window.isoform = (d) => {
    decl = d;
    document.title = `Isoform: ${d.name}`;
    $("name").textContent = d.name;
    $("means").textContent = d.means;
    $("effect").textContent = d.effect ? `Effect: ${d.effect}` : "";
    $("rules").textContent = `Rules: ${d.rules.map((n) => String(n).padStart(2, "0")).join(" · ")}`;
    const ic = ISOFORM_ICON;
    $("credit").innerHTML = "";
    $("credit").append(`Icon: “${ic.title}” (${ic.variant}) from `, Object.assign(document.createElement("a"), { href: "https://isocons.app", textContent: "Isocons" }),
      ", licensed ", Object.assign(document.createElement("a"), { href: "https://creativecommons.org/licenses/by/4.0/", textContent: "CC BY 4.0" }), ". Split into parts and animated.");
    show();
    mount();
  };

  slider.addEventListener("input", () => { show(); if (decl) handle?.set(value(Number(slider.value))); });
  $("fx").addEventListener("click", () => {
    const on = stage.dataset.gl === "off";
    stage.dataset.gl = on ? "on" : "off";
    $("fx").setAttribute("aria-pressed", String(on));
    if (decl) mount();
  });
  $("theme").addEventListener("click", () => {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    stage.dispatchEvent(new Event("isoform:theme"));
  });
  matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => stage.dispatchEvent(new Event("isoform:theme")));
})();
</script>
<script type="module" id="if-figure">
/*FIGURE*/
</script>
</body>
</html>
